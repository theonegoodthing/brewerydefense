<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brewery Defence</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #f1f1f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 1.8rem;
      color: #f39c12;
    }
    #ui {
      display: flex;
      gap: 20px;
      margin-bottom: 12px;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .hud-val { color: #f1c40f; }
    #game-container {
      position: relative;
      border: 3px solid #444;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      background: #2c3e50;
      cursor: crosshair;
    }
    #controls {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .tower-btn {
      background: #34495e;
      border: 2px solid #555;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tower-btn.selected {
      border-color: #f39c12;
      background: #46627f;
    }
    .tower-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #message {
      margin-top: 10px;
      height: 20px;
      font-size: 0.95rem;
      color: #e74c3c;
    }
  </style>
</head>
<body>

  <h1>🍺 Brewery Defence</h1>

  <div id="ui">
    <div>Bryggeri HP: <span id="hp" class="hud-val">100</span></div>
    <div>Maltpengar: <span id="money" class="hud-val">150</span> kr</div>
    <div>Våg: <span id="wave" class="hud-val">1</span></div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </div>

  <div id="controls">
    <button class="tower-btn selected" id="btn-malt" onclick="valjTorn('malt')">
      🌾 Maltkanon (50 kr)
    </button>
    <button class="tower-btn" id="btn-humle" onclick="valjTorn('humle')">
      🌿 Humlespruta (100 kr)
    </button>
    <button class="tower-btn" id="btn-jast" onclick="valjTorn('jast')">
      🧪 Jästbomb (175 kr)
    </button>
  </div>
  <div id="message"></div>
